name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck canonical ROM and decoder layer
        run: npm run typecheck:core

      - name: Canonical analysis regression tests
        run: npm run test:analysis

      - name: Production build
        run: npm run build

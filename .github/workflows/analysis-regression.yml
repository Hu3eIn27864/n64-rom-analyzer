name: Analysis Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Typecheck canonical ROM and decoder layer
        run: bun run typecheck:core

      - name: Analysis regression suite
        run: bun run test:analysis
